; PlatformIO project for the tracker firmware (VS Code + PlatformIO extension).
; Open the firmware/ folder in VS Code, then use the PlatformIO toolbar:
; Build (tick), Upload (arrow), Serial Monitor (plug). See tracker/README.md.
;
; The sources are the Arduino sketch in tracker/ (also opens in the Arduino IDE).
; The official PlatformIO espressif32 platform stops at Arduino core 2.x; this
; firmware needs core 3.x, so it uses the community "pioarduino" platform,
; pinned to the release that carries Arduino-ESP32 3.3.12 (the version the
; firmware is tested with).
[platformio]
src_dir = tracker
default_envs = nano_esp32

[env:nano_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = arduino_nano_esp32
framework = arduino
; Same flash layout as the Arduino IDE's "With SPIFFS partition (advanced)":
; 2 x 3 MB app + 9.4 MB data (LittleFS ring buffer).
board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
